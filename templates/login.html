  <body>
    <h1 style="text-align: center">Login</h1>
    <form class="container my-3">
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          id="emailid"
          aria-describedby="emailHelp"
          required
        />
        <div id="emailHelp" class="form-text">
          We'll never share your email with anyone else.
        </div>
      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
          required
        />
      </div>
      <!-- <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1">
          <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div> -->
      <button type="submit" class="btn btn-primary" id="submit" onclick="eventt()">Log In</button>
    </form>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
      
        const firebaseConfig = {
          apiKey: "AIzaSyA1Y6r6oC-M5XKC0cwbrNAAStRa3jrssyU",
          authDomain: "login-ca987.firebaseapp.com",
          projectId: "login-ca987",
          storageBucket: "login-ca987.firebasestorage.app",
          messagingSenderId: "861756286224",
          appId: "1:861756286224:web:1c1ef9b5a9f241841a7195",
          measurementId: "G-5G4PTG5EGE"
        };
      
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
      
        // Attach the Google Sign-In event
        const googleButton = document.querySelector(".login-with-google-btn");
        googleButton.addEventListener("click", () => {
          signInWithPopup(auth, provider)
            .then((result) => {
              const user = result.user;
              alert("Logged in as: " + user.displayName);
              // Redirect to dashboard or do something with user info
              window.location.href = "templates\index.html"; // change this to your actual dashboard page
            })
            .catch((error) => {
              console.error("Error during Google Sign-In", error);
              alert("Login Failed: " + error.message);
            });
        });
