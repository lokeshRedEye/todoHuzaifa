<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script type="module" src="/static/register.js"></script>
  </head>
  <body>
    <h1 style="text-align: center">Sign up</h1>
    <form class="container my-3">
      <div class="mb-3">
        <label for="exampleInputEmail1" class="form-label">Email address</label>
        <input
          type="email"
          class="form-control"
          id="emailid"
          aria-describedby="emailHelp"
        />
        <div id="emailHelp" class="form-text">
          We'll never share your email with anyone else.
        </div>
      </div>
      <div class="mb-3">
        <label for="exampleInputPassword1" class="form-label">Password</label>
        <input
          type="password"
          class="form-control"
          id="password"
        />
      </div>
      
      <!-- <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="exampleCheck1">
          <label class="form-check-label" for="exampleCheck1">Check me out</label>
        </div> -->
      <button type="submit" class="btn btn-primary" id="submit" onclick="event()">Create Account</button>
      <br>

      <div class="logininfo" style="margin-top: 10px;">
        <a href="{{ url_for('login') }}">Log in</a>
      <p>If have account already</p>
      </div>
    </form>
    <h3 style="margin-left: 3.5rem">Or</h3>
    <button type="button" class="login-with-google-btn" style="margin-left: 4rem;">
      Sign in with Google
    </button>

        &:active {

        }

        &:focus {
          outline: none;

        }

        &:disabled {
